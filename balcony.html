<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f1e3">
  <meta name="description" content="在雨来前挪一挪晾绳上的衣物，让每件衣物都晒到足够的阳光。">
  <meta name="version" content="0.1.0">
  <title>雨停前的阳台</title>
  <style>
:root {
  color-scheme: light;
  --paper: #f7f1e3;
  --ink: #213f37;
  --quiet: #4d6558;
  --line: #cfcdb9;
  --sun: #e4a746;
  --shade: #53727a;
  --heading: "Songti SC", "Noto Serif CJK SC", STSong, SimSun, serif;
  font: 15px/1.5 "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  color: var(--ink);
  background: var(--paper);
}

*, *::before, *::after { box-sizing: border-box; }
p, h1, h2 { margin: 0; }

body {
  min-height: 100vh;
  margin: 0;
  background:
    radial-gradient(ellipse at 32% 12%, #fffaf0 0%, transparent 60%),
    linear-gradient(145deg, #f9f3e7, #eee9d9);
}

button {
  color: inherit;
  font: inherit;
  border: 0;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

button:disabled { cursor: default; }
button:focus-visible {
  outline: 2px solid #245b53;
  outline-offset: 3px;
}

.game {
  display: grid;
  grid-template-areas: "intro" "forecast" "scene" "guide" "actions";
  gap: 12px;
  max-width: 486px;
  margin-inline: auto;
  padding: 14px 12px max(18px, env(safe-area-inset-bottom));
}

.intro { grid-area: intro; }

.chapter-line {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 4px;
}

.chapter {
  color: #4c6556;
  font-size: 12px;
  font-weight: 650;
  letter-spacing: .045em;
}

.chapter b {
  color: var(--ink);
  padding-left: .6em;
  font-weight: 650;
}

.reset {
  flex: none;
  min-height: 44px;
  padding: 0 6px;
  color: var(--quiet);
  background: transparent;
  border-radius: 7px;
  font-size: 12px;
}

.reset span {
  vertical-align: -.035em;
  font-size: 16px;
}

h1 {
  margin-block: 0 2px;
  color: #244c40;
  font: 750 clamp(31px, 8.6vw, 42px)/1.14 var(--heading);
  letter-spacing: .055em;
}

.goal {
  margin-top: 7px;
  color: var(--quiet);
  font-size: 13px;
}

.forecast {
  grid-area: forecast;
  min-width: 0;
}

.preview-label {
  margin-bottom: 5px;
  color: var(--quiet);
  font-size: 12px;
  font-weight: 650;
}

.hours {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
}

.hour {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-height: 44px;
  min-width: 0;
  padding: 2px;
  border: 1px solid #c6cbb9;
  border-radius: 8px;
  background: #f9f5eb;
  font-size: 12px;
  white-space: nowrap;
  transition: background-color 140ms, border-color 140ms;
}

.hour[aria-pressed="true"] {
  border-color: #2f5a49;
  color: #fefbf2;
  background: #315747;
}

.hour[aria-pressed="true"] .clock { color: #f1dfb6; }

.clock {
  color: #526b5d;
  font-size: 10px;
  font-variant-numeric: tabular-nums;
}

.board {
  position: relative;
  isolation: isolate;
  grid-area: scene;
  overflow: hidden;
  align-self: start;
  aspect-ratio: 16 / 17;
  min-width: 0;
  background-color: #c0dcd2;
  background-size: cover;
  background-position: center;
  border: 1px solid #748b74;
  border-radius: 12px;
  box-shadow: 0 3px 0 #d8d3bd, 0 11px 20px -17px #5c6a50;
  animation: scene-in 420ms ease-out both;
}

.board canvas, .slots, .rain {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.board canvas, .rain { pointer-events: none; }
.rain { opacity: 0; }

.board[data-rain] .rain {
  background:
    repeating-linear-gradient(112deg, transparent 0 26px, #e8f4e866 27px 28px, transparent 29px 51px),
    linear-gradient(180deg, #294f5f4a, #315a6b09 83%);
  animation: shower 500ms ease-out both;
}

.row-tag {
  position: absolute;
  left: 6.4%;
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 0 5px;
  color: #23473c;
  border-bottom: 1px solid #6b8579;
  border-radius: 3px 3px 0 0;
  background: #f8f5e6e8;
  font-size: clamp(10px, 2.9vw, 13px);
  font-weight: 700;
  line-height: 1.55;
}

.row-tag span {
  color: #485f53;
  font-size: .88em;
  font-weight: 500;
}

.row-tag--outside { top: 18%; }
.row-tag--inside { top: 54.4%; }

.slot {
  position: absolute;
  z-index: 0;
  left: var(--x);
  top: var(--y);
  display: flex;
  justify-content: center;
  align-items: flex-end;
  width: 20%;
  height: 30%;
  padding: 0 1px;
  transform: translateX(-50%);
  border-radius: 8px;
  background: transparent;
  color: var(--ink);
}

.slot::after {
  content: "";
  position: absolute;
  z-index: -1;
  inset: 2px 0 0;
  border: 1px solid transparent;
  border-radius: 8px;
  pointer-events: none;
}

.slot[data-selected]::after {
  border: 2px solid #2e6854;
  background: #ffffff16;
  box-shadow: 0 0 0 2px #fff6ca inset;
}

.slot[data-target]::after {
  border-color: #407861;
  border-style: dashed;
  background: #f9edba30;
}

.slot:focus-visible { outline-offset: -3px; }

.empty-mark {
  position: absolute;
  top: 35%;
  left: 50%;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  transform: translateX(-50%);
  border: 1px dashed #567568;
  border-radius: 50%;
  color: #315444;
  background: #f9f6e769;
  font-size: 16px;
  line-height: 1;
  pointer-events: none;
}

.slot[data-target] .empty-mark {
  border-color: #284b3f;
  border-style: solid;
  background: #fff4c7;
}

.tag {
  display: grid;
  justify-items: center;
  gap: 2px;
  width: max-content;
  max-width: 100%;
  padding: 2px 4px 3px;
  border: 1px solid #dfd4b5;
  border-radius: 4px;
  box-shadow: 0 1px 3px #273a3929;
  background: #fff9e6;
  font-size: clamp(10px, 2.75vw, 13px);
  line-height: 1.24;
  white-space: nowrap;
  pointer-events: none;
}

.tag[hidden], .empty-mark[hidden] { display: none; }
.slot[data-shade] .tag { border-color: #afc3c2; background: #edf1e9; }
.tag b { margin-left: .22em; font-variant-numeric: tabular-nums; }

.ticks {
  display: grid;
  width: 100%;
  grid-template-columns: repeat(3, 1fr);
  gap: 2px;
}

.tick, .key {
  display: block;
  border: 1px solid #3d6873;
  background: #bdd0ce;
}

.tick {
  position: relative;
  height: 4px;
  border-radius: 2px;
}

.tick[data-lit], .key--lit {
  border-color: #936129;
  background: #ecb85f;
}

.tick[data-current]::after {
  content: "";
  position: absolute;
  right: 22%;
  left: 22%;
  top: -3px;
  height: 1px;
  background: #1d4134;
}

.guide { grid-area: guide; min-width: 0; }

.legend {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 3px 13px;
  min-height: 18px;
  color: #496052;
  font-size: 11px;
}

.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend .ratio-label { margin-left: auto; white-space: nowrap; }
.key { width: 11px; height: 7px; border-radius: 2px; }

.message {
  min-height: 39px;
  margin-top: 8px;
  padding-left: 8px;
  border-left: 2px solid #d0a755;
  color: #385146;
  font-size: 13px;
  line-height: 1.5;
}

.message[data-result="failed"] { border-color: #ad624b; color: #793a2b; }
.message[data-result="passed"] { border-color: #5f885a; color: #244c39; }

.actions { grid-area: actions; }

.finish {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  min-height: 49px;
  padding: 8px 15px;
  border: 1px solid #264a3e;
  border-radius: 8px;
  color: #fffaf0;
  background: #285143;
  box-shadow: 0 2px 0 #173d32;
  font-size: 15px;
  font-weight: 750;
  letter-spacing: .085em;
  transition: transform 120ms, background-color 120ms, box-shadow 120ms;
}

.finish i {
  width: 11px;
  height: 9px;
  transform: skewX(-27deg);
  border-right: 1px solid #e8c886;
  border-left: 1px solid #e8c886;
}

.finish[data-passed] i {
  width: 8px;
  height: 8px;
  transform: rotate(-45deg);
  border: 0;
  border-right: 2px solid #e8c886;
  border-bottom: 2px solid #e8c886;
}

.finish:disabled { opacity: .72; }

@media (hover: hover) {
  .reset:hover:not(:disabled) { background: #e9e5d5; }
  .hour:hover:not([aria-pressed="true"], :disabled) { background: #eaeedf; }
  .slot:enabled:hover::after { border-color: #426b54; }
  .finish:enabled:hover { background: #346352; }
  .dialog-actions button:hover { filter: brightness(.94); }
}

.finish:active:not(:disabled) {
  transform: translateY(2px);
  box-shadow: none;
}

dialog {
  width: min(337px, calc(100% - 32px));
  padding: 21px;
  color: var(--ink);
  border: 1px solid #78917c;
  border-radius: 12px;
  box-shadow: 0 12px 34px #233f3755;
  background: var(--paper);
}

dialog::backdrop { background: #1f3b3785; }
dialog h2 { font: 750 22px/1.35 var(--heading); }
dialog p { margin: 8px 0 16px; color: var(--quiet); font-size: 13px; }

.dialog-actions { display: flex; gap: 8px; }

.dialog-actions button {
  flex: 1;
  min-height: 44px;
  padding: 3px;
  border: 1px solid #a1ad94;
  border-radius: 7px;
  background: #fdf8eb;
  font-size: 13px;
  font-weight: 650;
}

.dialog-actions .confirm { color: #fff9ec; background: #315747; border-color: #315747; }

@keyframes scene-in {
  from { opacity: .65; transform: translateY(3px); }
}
@keyframes shower {
  from { opacity: 0; transform: translateY(-7px); }
  58% { opacity: .73; }
  to { opacity: 0; transform: translateY(13px); }
}

@media (min-width: 780px) {
  body { display: grid; align-items: center; }

  .game {
    grid-template: "scene ." 1fr "scene intro" auto "scene forecast" auto "scene guide" auto "scene actions" auto "scene ." 1fr / minmax(0, 1.58fr) minmax(265px, 1fr);
    width: min(100%, 960px);
    max-width: none;
    gap: 18px clamp(24px, 4.6vw, 64px);
    padding: 30px 28px;
  }

  h1 { font-size: clamp(36px, 4.15vw, 48px); }
  .goal, .message { font-size: 15px; }
  .hour { min-height: 49px; font-size: 13px; }
  .clock { font-size: 11px; }
  .legend, .chapter { font-size: 13px; }
  .board { border-radius: 15px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

  <dialog id="reset-dialog" aria-labelledby="reset-title" aria-describedby="reset-description">
    <form method="dialog">
      <h2 id="reset-title">重新摆这一关？</h2>
      <p id="reset-description">衣物会回到这一关开始时的位置。</p>
      <div class="dialog-actions">
        <button value="cancel" autofocus>继续摆</button>
        <button value="reset" class="confirm">重置本关</button>
      </div>
    </form>
  </dialog>

  <script>
const COLS = 4;

const TIMES = [
  { label: "早上", clock: "09:00", offset: 1 },
  { label: "正午", clock: "12:00", offset: 0 },
  { label: "下午", clock: "15:00", offset: -1 },
];

const GARMENTS = {
  towel: { name: "浴巾", needs: 3, castsShadow: true },
  sheet: { name: "床单", needs: 3, castsShadow: true },
  shirt: { name: "衬衫", needs: 3, castsShadow: false },
  shorts: { name: "短裤", needs: 2, castsShadow: false },
  cloth: { name: "手帕", needs: 2, castsShadow: false },
};

const LEVELS = [
  {
    title: "浴巾让一让",
    goal: "给衬衫晒满 3 格阳光。",
    hint: "浴巾挡住了后排的光。点浴巾，再点别的格子。",
    layout: [null, "towel", null, null, null, "shirt", null, null],
  },
  {
    title: "阳光转个弯",
    goal: "让五件衣物晒到各自需要的格数。",
    hint: "床单也会挡光。切换时段，看看两道影子落在哪。",
    layout: ["towel", "sheet", null, null, "shirt", "shorts", "cloth", null],
  },
];

// 影子可以落到晾绳两侧。只有落在后排四个格里的影子会影响晒度。
function shadowsAt(layout, time) {
  return layout.slice(0, COLS).flatMap((id, column) => {
    if (!GARMENTS[id]?.castsShadow) return [];
    return [{ from: column, to: column + TIMES[time].offset }];
  });
}

function forecast(layout) {
  const shadows = TIMES.map((_, time) => shadowsAt(layout, time));
  return layout.map((id, slot) => {
    if (!id) return null;
    const sunlight = shadows.map((paths) =>
      slot < COLS || paths.every(({ to }) => to !== slot - COLS)
    );
    const total = sunlight.filter(Boolean).length;
    const needs = GARMENTS[id].needs;
    return { id, sunlight, total, needs, missing: Math.max(0, needs - total) };
  });
}

function moveGarment(layout, from, to) {
  const next = layout.slice();
  [next[from], next[to]] = [next[to], next[from]];
  return next;
}


const WIDTH = 480;
const HEIGHT = 510;
const COLUMNS = [91, 190, 290, 389];

function hangerPosition(slot) {
  const col = slot % COLS;
  const rowY = slot < COLS ? 131 : 305;
  return { x: COLUMNS[col], y: rowY + (col === 0 || col === COLS - 1 ? 4 : 8) };
}

const FABRIC = {
  towel: {
    shape: "M-29 7 Q-12 5 1 8 Q19 11 32 6 L34 96 Q14 103 0 99 Q-19 95-35 100 Q-32 76-29 7Z",
    sun: ["#f5ae8b", "#d9745b", "#aa4e3d"],
    shade: ["#b77b6e", "#925d59", "#68484a"],
    seam: "M-25 10 Q-30 62-30 95 M28 10 L29 94 M-30 91 Q-12 87 0 92 Q17 97 29 91",
    pins: [-19, 20],
    tilt: -.045,
  },
  sheet: {
    shape: "M-39 7 Q-13 4 0 10 Q19 13 37 6 Q39 36 38 58 L44 98 Q25 92 12 100 Q-3 103-12 98 Q-28 92-43 98 Q-39 76-39 67Z",
    sun: ["#a7c2ca", "#6b9fad", "#537a8b"],
    shade: ["#819fa9", "#547785", "#415d69"],
    seam: "M-36 10 L-38 92 Q-24 87-11 94 Q2 100 12 96 Q23 90 40 93",
    pins: [-27, 25],
    tilt: .034,
  },
  shirt: {
    shape: "M-14 8 Q-24 10-32 16 L-43 40 L-27 49 L-20 39 L-21 85 Q-5 91 7 87 Q16 86 25 89 L23 39 L29 46 L44 36 L33 15 Q24 10 13 8 Q0 15-14 8Z",
    sun: ["#fff8d8", "#ebd6a5", "#ceb785"],
    shade: ["#d0d7cc", "#a3b4ac", "#79918a"],
    seam: "M-40 37 L-28 43 M30 41 L41 34 M-19 82 Q-5 87 7 84 Q15 83 23 86 M0 20 L2 85",
    pins: [-25, 25],
    tilt: .019,
  },
  shorts: {
    shape: "M-34 8 Q-11 12 6 8 Q21 6 35 9 Q34 33 37 63 Q17 66 5 66 L0 49 L-8 67 Q-25 67-36 62 Q-34 41-34 8Z",
    sun: ["#a7b781", "#788f60", "#5a7351"],
    shade: ["#829575", "#5d7764", "#496052"],
    seam: "M-31 15 Q-8 19 7 15 Q20 13 33 15 M-33 57 Q-21 62-9 61 M8 60 Q22 62 34 58 M0 19 Q6 34 0 49 M-23 17 Q-25 30-33 32 M23 16 Q25 28 34 31",
    pins: [-23, 22],
    tilt: -.04,
  },
  cloth: {
    shape: "M-30 8 Q-12 11 2 8 Q19 5 30 9 Q29 28 33 61 Q11 66-4 63 Q-18 60-33 63 Q-31 36-30 8Z",
    sun: ["#f9d88a", "#d6a655", "#a87e49"],
    shade: ["#c4b17e", "#a28a5e", "#766c51"],
    seam: "M-27 12 Q-7 16 3 12 Q20 8 27 13 L29 58 Q9 62-3 59 Q-19 56-29 59Z",
    pins: [-19, 19],
    tilt: .075,
  },
};

function line(ctx, points, color, width = 1) {
  ctx.beginPath();
  ctx.moveTo(...points[0]);
  for (const point of points.slice(1)) ctx.lineTo(...point);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.stroke();
}

function ellipse(ctx, x, y, rx, ry, color) {
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
}

function paintSky(ctx, time) {
  const x = 240 - TIMES[time].offset * 128;
  const y = 50;
  const glow = ctx.createRadialGradient(x, y, 5, x, y, 220);
  glow.addColorStop(0, "#fff0adbd");
  glow.addColorStop(.42, "#ffe7a44a");
  glow.addColorStop(1, "#ffe7a400");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, WIDTH, HEIGHT);
  ctx.save();
  ctx.translate(x, y);
  for (let ray = 0; ray < 8; ray += 1) {
    ctx.rotate(Math.PI / 4);
    line(ctx, [[0, 23], [0, 29]], "#9b632bc9", 1.6);
  }
  ellipse(ctx, 0, 0, 16, 16, "#bd823b");
  ellipse(ctx, -1, -1, 15, 15, "#ffe49a");
  ellipse(ctx, -4, -5, 8, 6, "#fff0bb");
  ctx.restore();
}

function paintShadow(ctx, { from, to }) {
  const x = COLUMNS[from];
  const target = x + (to - from) * 100;
  const shadow = ctx.createLinearGradient(0, 207, 0, 442);
  shadow.addColorStop(0, "#33555d18");
  shadow.addColorStop(.4, "#35546262");
  shadow.addColorStop(.84, "#31536261");
  shadow.addColorStop(1, "#34536813");
  ctx.beginPath();
  ctx.moveTo(x - 31, 211);
  ctx.lineTo(x + 31, 211);
  ctx.lineTo(target + 41, 310);
  ctx.lineTo(target + 43, 439);
  ctx.quadraticCurveTo(target, 447, target - 43, 439);
  ctx.lineTo(target - 41, 310);
  ctx.closePath();
  ctx.fillStyle = shadow;
  ctx.fill();
  ctx.save();
  ctx.setLineDash([3, 4]);
  line(ctx, [[x - 30, 215], [target - 40, 309], [target - 41, 430]], "#274a5682", 1.2);
  line(ctx, [[x + 30, 215], [target + 40, 309], [target + 41, 430]], "#274a5682", 1.2);
  ctx.restore();
}

function paintRope(ctx, y) {
  ctx.beginPath();
  ctx.moveTo(28, y);
  ctx.bezierCurveTo(127, y + 11, 353, y + 11, 452, y);
  ctx.lineWidth = 3.6;
  ctx.strokeStyle = "#665536";
  ctx.stroke();

  ctx.save();
  ctx.translate(0, -1);
  ctx.beginPath();
  ctx.moveTo(28, y);
  ctx.bezierCurveTo(127, y + 11, 353, y + 11, 452, y);
  ctx.lineWidth = 1.3;
  ctx.strokeStyle = "#e6ca86";
  ctx.stroke();
  ctx.restore();

  for (const x of [28, 452]) {
    ellipse(ctx, x, y, 6, 6, "#4e6250");
    ellipse(ctx, x - 1, y - 1, 3.2, 3.8, "#bead75");
    line(ctx, [[x - 1, y - 2], [x + 1, y + 1]], "#716045");
  }
}

function paintPattern(ctx, id) {
  if (id === "towel") {
    ctx.fillStyle = "#fff1c52f";
    for (const x of [-21, -18, 17, 20]) ctx.fillRect(x, 5, 1.2, 100);
    ctx.fillStyle = "#f8deaf62";
    for (const y of [76, 80, 83]) ctx.fillRect(-45, y, 90, y === 80 ? 1 : 2);
  }
  if (id === "sheet" || id === "cloth") {
    ctx.fillStyle = id === "sheet" ? "#eff0d437" : "#fff1be52";
    const step = id === "sheet" ? 14 : 10;
    for (let offset = -42; offset < 51; offset += step) {
      ctx.fillRect(offset, 0, 2, 108);
      ctx.fillRect(-46, offset + 44, 94, 2);
    }
  }
  if (id === "shirt") {
    ctx.fillStyle = "#f7e9c2ad";
    ctx.strokeStyle = "#687d7067";
    const collar = new Path2D("M-13 8 L-6 12 L1 19 L-9 25 L-17 14 Z M13 8 L6 13 L1 19 L10 24 L17 13 Z");
    ctx.fill(collar);
    ctx.stroke(collar);
    const pocket = new Path2D("M8 31 L19 30 L19 43 Q14 47 8 43Z");
    ctx.fill(pocket);
    ctx.stroke(pocket);
    for (const y of [29, 44, 58, 72, 82]) ellipse(ctx, 2, y, 1.15, 1.15, "#667c73b0");
  }
  if (id === "shorts") {
    line(ctx, [[-3, 17], [-5, 23], [2, 23], [0, 17], [5, 25]], "#e4db9abc", 1.2);
  }
}

function paintPeg(ctx, x, tilt) {
  ctx.save();
  ctx.translate(x, 0);
  ctx.rotate(tilt);
  ctx.fillStyle = "#755c3b";
  ctx.fillRect(-2.9, -6.7, 6.2, 19);
  ctx.fillStyle = "#e1b878";
  ctx.fillRect(-2.3, -6, 4.2, 17.6);
  line(ctx, [[-.7, -4], [-.7, 10]], "#ac7849");
  line(ctx, [[-3, 2], [3, 2]], "#5f665c", 1.45);
  ctx.restore();
}

function paintGarment(ctx, slot, item, time) {
  const { x, y } = hangerPosition(slot);
  const fabric = FABRIC[item.id];
  const path = new Path2D(fabric.shape);
  const lit = item.sunlight[time];
  const colors = lit ? fabric.sun : fabric.shade;

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(fabric.tilt);
  const dye = ctx.createLinearGradient(-36, 13, 39, 84);
  dye.addColorStop(0, colors[0]);
  dye.addColorStop(.55, colors[1]);
  dye.addColorStop(1, colors[2]);
  ctx.save();
  ctx.fillStyle = dye;
  ctx.shadowColor = "#263e3d63";
  ctx.shadowBlur = 4;
  ctx.shadowOffsetY = 3;
  ctx.fill(path);
  ctx.restore();

  ctx.save();
  ctx.clip(path);
  for (const fold of [-25, -9, 12, 26]) {
    ctx.beginPath();
    ctx.moveTo(fold, 5);
    ctx.bezierCurveTo(fold + 5, 37, fold - 6, 68, fold + 3, 108);
    ctx.strokeStyle = lit ? "#fef0c64e" : "#e7eadd30";
    ctx.lineWidth = 2.4;
    ctx.stroke();
    ctx.translate(2.3, 0);
    ctx.strokeStyle = "#3e4f4420";
    ctx.lineWidth = 2.8;
    ctx.stroke();
    ctx.translate(-2.3, 0);
  }
  for (let stitch = 0; stitch < 112; stitch += 1) {
    const sx = (stitch * 71 % 353) / 4 - 45;
    const sy = (stitch * 123 % 389) / 4 + 6;
    line(ctx, [[sx, sy], [sx + 1.8, sy + .23]], stitch % 2 ? "#fff6d13b" : "#243f3729", .65);
  }
  paintPattern(ctx, item.id);
  ctx.strokeStyle = lit ? "#61553d87" : "#435f5994";
  ctx.lineWidth = .9;
  ctx.setLineDash([2.2, 1.8]);
  ctx.stroke(new Path2D(fabric.seam));
  ctx.restore();

  ctx.strokeStyle = lit ? "#5a604b91" : "#354f4b88";
  ctx.lineWidth = 1.15;
  ctx.stroke(path);
  paintPeg(ctx, fabric.pins[0], -.12);
  paintPeg(ctx, fabric.pins[1], .13);
  ctx.restore();
}

function drawBalcony(canvas, layout, scores, time) {
  const bounds = canvas.getBoundingClientRect();
  const scale = Math.min(window.devicePixelRatio || 1, 2);
  const pixelWidth = Math.round(bounds.width * scale);
  const pixelHeight = Math.round(bounds.height * scale);
  if (!pixelWidth || !pixelHeight) return;
  if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
    canvas.width = pixelWidth;
    canvas.height = pixelHeight;
  }

  const ctx = canvas.getContext("2d");
  ctx.setTransform(pixelWidth / WIDTH, 0, 0, pixelHeight / HEIGHT, 0, 0);
  ctx.clearRect(0, 0, WIDTH, HEIGHT);
  paintSky(ctx, time);
  shadowsAt(layout, time).forEach((shadow) => paintShadow(ctx, shadow));

  for (const row of [0, 1]) {
    paintRope(ctx, row === 0 ? 131 : 305);
    for (let col = 0; col < COLS; col += 1) {
      const slot = row * COLS + col;
      const item = scores[slot];
      if (item) paintGarment(ctx, slot, item, time);
      else {
        const { x, y } = hangerPosition(slot);
        ellipse(ctx, x, y - 1, 3.3, 3.3, "#706a4c");
        ellipse(ctx, x - .5, y - 1.5, 1.5, 1.5, "#f0d899");
      }
    }
  }
}


(() => {
  const $ = (id) => document.getElementById(id);
  const board = $("board");
  const canvas = $("painting");
  const chapter = $("chapter");
  const goal = $("goal");
  const message = $("message");
  const finish = $("finish");
  const finishText = $("finish-text");
  const reset = $("reset");
  const resetDialog = $("reset-dialog");

  let level = 0;
  let layout = LEVELS[level].layout.slice();
  let scores = forecast(layout);
  let time = 1;
  let phase = "arrange";
  let selected = null;
  let actionNote = "";

  const hours = TIMES.map(({ label, clock }, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "hour";
    button.innerHTML = '<span>' + label + '</span><span class="clock">' + clock + '</span>';
    button.addEventListener("click", () => {
      time = index;
      render();
    });
    $("hours").append(button);
    return button;
  });

  const slots = layout.map((_, index) => {
    const button = document.createElement("button");
    const { x } = hangerPosition(index);
    button.type = "button";
    button.className = "slot";
    button.style.setProperty("--x", (x / WIDTH * 100) + "%");
    button.style.setProperty("--y", ((index < COLS ? 116 : 290) / HEIGHT * 100) + "%");
    button.innerHTML = `
      <span class="empty-mark" aria-hidden="true">+</span>
      <span class="tag" aria-hidden="true">
        <span><span class="item-name"></span><b class="ratio"></b></span>
        <span class="ticks"><i class="tick"></i><i class="tick"></i><i class="tick"></i></span>
      </span>`;
    button.addEventListener("click", () => choose(index));
    $("slots").append(button);
    return button;
  });

  function startLevel(nextLevel) {
    level = nextLevel;
    layout = LEVELS[level].layout.slice();
    scores = forecast(layout);
    time = 1;
    phase = "arrange";
    selected = null;
    actionNote = "";
    chapter.replaceChildren(
      document.createTextNode("第 " + (level + 1) + " / " + LEVELS.length + " 关"),
      Object.assign(document.createElement("b"), { textContent: LEVELS[level].title }),
    );
    goal.textContent = LEVELS[level].goal;
    render();
  }

  function choose(index) {
    if (phase === "settling" || phase === "passed") return;
    if (selected === null) {
      if (layout[index]) {
        selected = index;
        actionNote = "";
      } else {
        actionNote = "先点衣物，再点空位。";
      }
    } else if (selected === index) {
      selected = null;
    } else {
      const name = GARMENTS[layout[selected]].name;
      const other = GARMENTS[layout[index]]?.name;
      layout = moveGarment(layout, selected, index);
      scores = forecast(layout);
      selected = null;
      phase = "arrange";
      actionNote = other ? name + "和" + other + "已交换。" : "已移动" + name + "。";
    }
    render();
  }

  function renderSlot(button, index) {
    const item = scores[index];
    const isSelected = selected === index;
    const isTarget = selected !== null && !isSelected;
    const location = (index < COLS ? "前排" : "后排") + "第 " + (index % COLS + 1) + " 格";
    button.toggleAttribute("data-selected", isSelected);
    button.toggleAttribute("data-target", isTarget);
    button.toggleAttribute("data-shade", Boolean(item && !item.sunlight[time]));
    button.disabled = phase === "settling" || phase === "passed";
    button.querySelector(".empty-mark").hidden = Boolean(item);
    button.querySelector(".tag").hidden = !item;

    if (!item) {
      button.removeAttribute("aria-pressed");
      button.setAttribute("aria-label", location + "，空位" + (isTarget ? "，移到这里" : ""));
      return;
    }

    const name = GARMENTS[item.id].name;
    const light = item.sunlight[time] ? "有日照" : "被挡光";
    const action = isSelected ? "，取消选择" : isTarget ? "，与这件交换" : "";
    button.setAttribute("aria-pressed", String(isSelected));
    button.setAttribute("aria-label",
      location + "，" + name + "，" + light + "，累计 " + item.total + " 格，所需 " + item.needs + " 格" + action
    );
    button.querySelector(".item-name").textContent = name;
    button.querySelector(".ratio").textContent = item.total + "/" + item.needs;
    button.querySelectorAll(".tick").forEach((tick, tickTime) => {
      tick.toggleAttribute("data-lit", item.sunlight[tickTime]);
      tick.toggleAttribute("data-current", tickTime === time);
    });
  }

  function renderMessage() {
    let text = LEVELS[level].hint;
    let result = "";
    if (phase === "settling") {
      text = "正在累计三段日照…";
    } else if (phase === "passed") {
      text = level === 0 ? "衣物晒干了。下一关还有一绳衣物。" : "两关完成。赶在下雨前收齐了衣物。";
      result = "passed";
    } else if (selected !== null) {
      text = "已选" + GARMENTS[layout[selected]].name + "。点空位移动，点衣物交换。";
    } else if (phase === "failed") {
      const deficits = scores.filter((item) => item?.missing).map(({ id, missing }) =>
        GARMENTS[id].name + "差 " + missing + " 格"
      );
      text = deficits.join("、") + "。挪动后可以再试。";
      result = "failed";
    } else if (actionNote) {
      text = actionNote;
    }
    if (message.textContent !== text) message.textContent = text;
    message.dataset.result = result;
  }

  function render() {
    const settling = phase === "settling";
    const passed = phase === "passed";
    hours.forEach((button, index) => {
      button.setAttribute("aria-pressed", String(time === index));
      button.disabled = settling;
    });
    reset.disabled = settling;
    finish.disabled = settling;
    finish.toggleAttribute("data-passed", passed);
    finishText.textContent = settling ? "等雨来…" : passed
      ? (level === LEVELS.length - 1 ? "回到第一关" : "去下一关")
      : "等到雨来";
    slots.forEach(renderSlot);
    renderMessage();
    repaint();
  }

  function repaint() {
    drawBalcony(canvas, layout, scores, time);
  }

  async function settle() {
    const previewTime = time;
    const restoreFocus = document.activeElement === finish;
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    phase = "settling";
    selected = null;
    if (!reduceMotion) {
      for (let index = 0; index < TIMES.length; index += 1) {
        time = index;
        render();
        await wait(350);
      }
      board.setAttribute("data-rain", "");
      await wait(500);
      board.removeAttribute("data-rain");
    }
    time = previewTime;
    phase = scores.some((item) => item?.missing) ? "failed" : "passed";
    render();
    if (restoreFocus) finish.focus({ preventScroll: true });
  }

  finish.addEventListener("click", (event) => {
    if (phase === "settling" || event.detail > 1) return;
    if (phase === "passed") {
      startLevel((level + 1) % LEVELS.length);
      window.scrollTo(0, 0);
      if (!event.detail) chapter.focus({ preventScroll: true });
    } else {
      void settle();
    }
  });
  finish.addEventListener("keydown", (event) => {
    if (event.repeat && (event.key === "Enter" || event.key === " ")) event.preventDefault();
  });

  reset.addEventListener("click", () => {
    if (phase === "settling") return;
    if (layout.every((id, index) => id === LEVELS[level].layout[index])) {
      startLevel(level);
    } else {
      resetDialog.returnValue = "";
      resetDialog.showModal();
    }
  });
  resetDialog.addEventListener("close", () => {
    if (resetDialog.returnValue === "reset") startLevel(level);
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && selected !== null && !resetDialog.open) {
      selected = null;
      render();
    }
  });

  chapter.tabIndex = -1;
  startLevel(0);
  new ResizeObserver(repaint).observe(canvas);
})();

  </script>
</body>
</html>
